<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">CVS-Act v3.1 component and data-flow diagram</title>
  <desc id="desc">A visual schematic showing a laparoscopic transition clip, temporal frame sampling, CVS score attachment, multimodal segmentation, actor timelines, structured taxonomy extraction, validation, an optional morphology checker, and train-validation-test export.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <linearGradient id="scope" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f1d1d"/><stop offset="0.55" stop-color="#be123c"/><stop offset="1" stop-color="#4c0519"/></linearGradient>
    <style>
      .h1{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.stage{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;letter-spacing:.08em}.label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.tiny{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.micro{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.code{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}.white{fill:white}.flow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dataflow{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#arrow-purple)}.dash{stroke-dasharray:7 7}.lane-label{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:end}
    </style>
  </defs>
  <rect width="1600" height="1080" rx="24" fill="#f8fafc"/>
  <text x="50" y="52" class="h1">CVS-Act v3.1: components and data flow</text>
  <text x="50" y="82" class="sub">Visual evidence becomes temporal descriptions, controlled actor labels, and dataset records through two distinct model calls.</text>

  <rect x="35" y="108" width="1530" height="292" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="58" y="137" class="stage">A · VIDEO AND CONTEXT PREPARATION</text>
  <rect x="35" y="420" width="1530" height="352" rx="20" fill="#f5f3ff" stroke="#ddd6fe"/><text x="58" y="449" class="stage">B · TWO-CALL MODEL PIPELINE</text>
  <rect x="35" y="792" width="1530" height="198" rx="20" fill="#f0fdfa" stroke="#99f6e4"/><text x="58" y="821" class="stage">C · DETERMINISTIC POST-PROCESSING AND EXPORT</text>

  <!-- Video clip: an abstract laparoscopic view and transition range -->
  <g filter="url(#shadow)">
    <rect x="65" y="160" width="250" height="205" rx="16" fill="white" stroke="#94a3b8"/>
    <circle cx="190" cy="252" r="75" fill="url(#scope)" stroke="#1e293b" stroke-width="5"/>
    <path d="M140 224 C160 188,218 190,241 222 C258 245,242 285,207 298 C169 313,128 284,140 224Z" fill="#f59e0b" opacity=".72"/>
    <path d="M181 229 C194 213,213 218,218 238 C221 258,210 278,190 282 C174 270,168 245,181 229Z" fill="#84cc16"/>
    <path d="M105 310 L174 260" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><path d="M274 194 L216 241" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><path d="M170 256 L181 248 M170 256 L178 267" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <text x="82" y="190" class="tiny">one transition clip</text><rect x="82" y="330" width="216" height="5" rx="2.5" fill="#cbd5e1"/><rect x="141" y="327" width="78" height="11" rx="5" fill="#ef4444"/><text x="82" y="354" class="micro">C1 / C2 / C3 transition range</text>
  </g>
  <text x="190" y="388" class="label" text-anchor="middle">Video evidence</text>

  <!-- Temporal sampling shown as a film strip -->
  <g filter="url(#shadow)">
    <rect x="380" y="160" width="570" height="205" rx="16" fill="white" stroke="#94a3b8"/><text x="405" y="190" class="label">Temporal sampler</text><text x="405" y="214" class="small">Anchors every 150 frames (~5 s), with four finer frames between anchors</text>
    <line x1="425" y1="285" x2="905" y2="285" stroke="#64748b" stroke-width="3"/>
    <rect x="420" y="242" width="66" height="54" rx="6" fill="#dbeafe" stroke="#0284c7" stroke-width="3"/><circle cx="453" cy="267" r="17" fill="#be123c"/><path d="M444 272 Q453 248 465 272" fill="#f59e0b"/><text x="453" y="315" class="micro" text-anchor="middle">anchor</text>
    <g fill="#f1f5f9" stroke="#94a3b8"><rect x="509" y="251" width="47" height="38" rx="5"/><rect x="577" y="251" width="47" height="38" rx="5"/><rect x="645" y="251" width="47" height="38" rx="5"/><rect x="713" y="251" width="47" height="38" rx="5"/></g>
    <g fill="#be123c"><circle cx="532" cy="269" r="12"/><circle cx="600" cy="269" r="12"/><circle cx="668" cy="269" r="12"/><circle cx="736" cy="269" r="12"/></g>
    <g fill="#f59e0b"><path d="M525 273 Q532 257 540 273"/><path d="M593 273 Q600 257 608 273"/><path d="M661 273 Q668 257 676 273"/><path d="M729 273 Q736 257 744 273"/></g>
    <rect x="783" y="242" width="66" height="54" rx="6" fill="#dbeafe" stroke="#0284c7" stroke-width="3"/><circle cx="816" cy="267" r="17" fill="#be123c"/><path d="M807 272 Q816 248 828 272" fill="#f59e0b"/><text x="816" y="315" class="micro" text-anchor="middle">anchor</text>
    <rect x="870" y="242" width="45" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="892" y="274" class="micro" text-anchor="middle">END</text><text x="453" y="340" class="code" text-anchor="middle">f=150</text><text x="816" y="340" class="code" text-anchor="middle">f=300</text>
  </g>

  <!-- Composed multimodal message: prompt + scored and unscored frames -->
  <g filter="url(#shadow)">
    <rect x="1015" y="160" width="500" height="205" rx="16" fill="white" stroke="#94a3b8"/><text x="1040" y="190" class="label">Composed multimodal input</text>
    <rect x="1040" y="215" width="138" height="115" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="1056" y="238" class="tiny">Prompt text</text><g stroke="#cbd5e1" stroke-width="5"><line x1="1056" y1="250" x2="1158" y2="250"/><line x1="1056" y1="265" x2="1145" y2="265"/><line x1="1056" y1="280" x2="1154" y2="280"/><line x1="1056" y1="295" x2="1126" y2="295"/></g>
    <text x="1205" y="236" class="code">Frame 000150</text><text x="1205" y="257" class="code">C1=1/3 · C2=2/3 · C3=0/3</text><rect x="1205" y="272" width="115" height="62" rx="7" fill="#dbeafe" stroke="#0284c7"/><circle cx="1262" cy="302" r="21" fill="#be123c"/><path d="M1250 309 Q1262 284 1276 309" fill="#f59e0b"/>
    <text x="1345" y="291" class="code">Frame 000180</text><text x="1345" y="312" class="tiny">number only</text><rect x="1345" y="320" width="130" height="18" rx="9" fill="#e2e8f0"/>
  </g>
  <path d="M315 260 L369 260" class="flow"/><path d="M950 260 L1004 260" class="flow"/>

  <!-- First model call as a processor rather than a step box -->
  <g filter="url(#shadow)">
    <rect x="65" y="480" width="245" height="225" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="90" y="510" class="stage">FIRST CALL · IMAGES + TEXT</text>
    <rect x="112" y="544" width="150" height="105" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><rect x="137" y="565" width="100" height="62" rx="8" fill="#7c3aed"/><text x="187" y="591" class="white label" text-anchor="middle">Qwen3.6</text><text x="187" y="613" class="white tiny" text-anchor="middle">multimodal</text>
    <g stroke="#7c3aed" stroke-width="4"><line x1="112" y1="563" x2="96" y2="563"/><line x1="112" y1="585" x2="96" y2="585"/><line x1="112" y1="607" x2="96" y2="607"/><line x1="112" y1="629" x2="96" y2="629"/><line x1="262" y1="563" x2="278" y2="563"/><line x1="262" y1="585" x2="278" y2="585"/><line x1="262" y1="607" x2="278" y2="607"/><line x1="262" y1="629" x2="278" y2="629"/></g><text x="187" y="681" class="small" text-anchor="middle">temporal visual reasoning</text>
  </g>

  <!-- Model output visualized as synchronized actor lanes -->
  <g filter="url(#shadow)">
    <rect x="360" y="480" width="535" height="225" rx="18" fill="white" stroke="#94a3b8"/><text x="385" y="510" class="label">Descriptive segmentation JSON</text><text x="385" y="532" class="small">Continuous ranges with natural-language evidence</text>
    <text x="430" y="570" class="lane-label">LEFT</text><rect x="447" y="552" width="175" height="28" rx="5" fill="#bae6fd"/><rect x="625" y="552" width="238" height="28" rx="5" fill="#7dd3fc"/><text x="534" y="571" class="micro" text-anchor="middle">holds lateral</text><text x="744" y="571" class="micro" text-anchor="middle">moves medial → lateral</text>
    <text x="430" y="615" class="lane-label">RIGHT</text><rect x="447" y="597" width="110" height="28" rx="5" fill="#ddd6fe"/><rect x="560" y="597" width="204" height="28" rx="5" fill="#c4b5fd"/><rect x="767" y="597" width="96" height="28" rx="5" fill="#ddd6fe"/><text x="502" y="616" class="micro" text-anchor="middle">inactive</text><text x="662" y="616" class="micro" text-anchor="middle">hook dissects near duct</text><text x="815" y="616" class="micro" text-anchor="middle">withdraws</text>
    <text x="430" y="660" class="lane-label">CAMERA</text><rect x="447" y="642" width="262" height="28" rx="5" fill="#bbf7d0"/><rect x="712" y="642" width="151" height="28" rx="5" fill="#86efac"/><text x="578" y="661" class="micro" text-anchor="middle">not moving</text><text x="787" y="661" class="micro" text-anchor="middle">zoom out</text>
    <line x1="447" y1="682" x2="863" y2="682" stroke="#64748b" stroke-width="2"/><text x="447" y="697" class="micro">start frame</text><text x="863" y="697" class="micro" text-anchor="end">end frame</text>
  </g>

  <!-- Second call visualized as a document combining free text and ontology -->
  <g filter="url(#shadow)">
    <rect x="945" y="480" width="270" height="225" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="970" y="510" class="stage">SECOND CALL · TEXT ONLY</text>
    <path d="M985 542 h112 l34 34 v94 h-146 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><path d="M1097 542 v34 h34" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="1004" y="579" class="code">{ segmentation }</text><text x="1004" y="603" class="tiny">+ allowed vocabularies</text><text x="1004" y="625" class="tiny">+ extraction rules</text><text x="1080" y="690" class="small" text-anchor="middle">constrained extraction</text>
  </g>

  <!-- Controlled schema shown as separate actor components -->
  <g filter="url(#shadow)">
    <rect x="1265" y="480" width="275" height="225" rx="18" fill="white" stroke="#94a3b8"/><text x="1290" y="510" class="label">Controlled taxonomy JSON</text>
    <circle cx="1308" cy="552" r="10" fill="#0284c7"/><text x="1328" y="557" class="code">left[]</text><rect x="1390" y="540" width="123" height="24" rx="5" fill="#e0f2fe"/><text x="1451" y="556" class="micro" text-anchor="middle">retraction code</text>
    <circle cx="1308" cy="590" r="10" fill="#7c3aed"/><text x="1328" y="595" class="code">right[]</text><rect x="1390" y="578" width="123" height="24" rx="5" fill="#ede9fe"/><text x="1451" y="594" class="micro" text-anchor="middle">tool/action/target</text>
    <circle cx="1308" cy="628" r="10" fill="#16a34a"/><text x="1328" y="633" class="code">camera[]</text><rect x="1390" y="616" width="123" height="24" rx="5" fill="#dcfce7"/><text x="1451" y="632" class="micro" text-anchor="middle">camera code</text>
    <circle cx="1308" cy="666" r="10" fill="#64748b"/><text x="1328" y="671" class="code">other[]</text><rect x="1390" y="654" width="123" height="24" rx="5" fill="#f1f5f9"/><text x="1451" y="670" class="micro" text-anchor="middle">ICG switch</text>
  </g>
  <path d="M1265 365 C1265 420,190 405,190 469" class="dataflow dash"/><text x="735" y="414" class="tiny" text-anchor="middle" fill="#7c3aed">ordered images + composed prompt</text>
  <path d="M310 592 L349 592" class="flow"/><path d="M895 592 L934 592" class="flow"/><path d="M1215 592 L1254 592" class="flow"/>

  <!-- Deterministic schema validation funnel -->
  <g><text x="170" y="858" class="label" text-anchor="middle">Schema validation</text><path d="M80 876 H260 L220 920 H120 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><path d="M120 920 H220 L194 948 H146 Z" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="170" y="900" class="tiny" text-anchor="middle">drop invalid · clip time · merge</text></g>

  <!-- Optional morphology questionnaire and conservative decision branch -->
  <g><text x="590" y="852" class="label" text-anchor="middle">Optional right-tool morphology branch</text><rect x="390" y="870" width="155" height="78" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="468" y="894" class="tiny" text-anchor="middle">10 shape questions</text><g fill="#f59e0b"><circle cx="425" cy="920" r="7"/><circle cx="449" cy="920" r="7"/><circle cx="473" cy="920" r="7"/><circle cx="497" cy="920" r="7"/></g>
    <path d="M585 870 L660 909 L585 948 L510 909 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="585" y="905" class="micro" text-anchor="middle">base Hook?</text><text x="585" y="920" class="micro" text-anchor="middle">checker Maryland?</text><rect x="700" y="879" width="155" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="777" y="903" class="code" text-anchor="middle">Hook → Maryland</text><text x="777" y="923" class="micro" text-anchor="middle">only this rewrite</text><path d="M545 909 L508 909" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 909 L689 909" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Versioned output files -->
  <g><text x="1110" y="850" class="label">Versioned dataset records</text><g filter="url(#shadow)"><path d="M1040 884 h128 l18 18 v58 h-146 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M1168 884 v18 h18" fill="none" stroke="#16a34a" stroke-width="2"/><text x="1105" y="916" class="code" text-anchor="middle">train.jsonl</text><text x="1105" y="941" class="tiny" text-anchor="middle">1,119 records</text>
    <path d="M1200 884 h128 l18 18 v58 h-146 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M1328 884 v18 h18" fill="none" stroke="#16a34a" stroke-width="2"/><text x="1265" y="916" class="code" text-anchor="middle">validation.jsonl</text><text x="1265" y="941" class="tiny" text-anchor="middle">193 records</text>
    <path d="M1360 884 h128 l18 18 v58 h-146 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M1488 884 v18 h18" fill="none" stroke="#16a34a" stroke-width="2"/><text x="1425" y="916" class="code" text-anchor="middle">test.jsonl</text><text x="1425" y="941" class="tiny" text-anchor="middle">481 records</text></g>
  </g>
  <path d="M1402 705 C1402 760,170 750,170 866" class="flow dash"/><text x="790" y="785" class="tiny" text-anchor="middle">controlled JSON enters deterministic code</text><path d="M260 915 L375 915" class="flow"/><path d="M855 915 L1025 915" class="flow"/>

  <rect x="35" y="1010" width="1530" height="48" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="58" y="1040" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#78350f">Evaluated dev artifact: 10/90 structured predictions corrected · Full train/test exports: 0 corrections applied because checker coverage/conditions were not met</text>
</svg>
